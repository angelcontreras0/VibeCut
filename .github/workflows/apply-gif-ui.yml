name: Apply GIF mode patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply GIF mode patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply GIF UI patch
        run: node scripts/apply-gif-ui.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Timeline.tsx public/i18n.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add optimized GIF mode"
          git push
