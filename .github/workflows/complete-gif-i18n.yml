name: Complete GIF translations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-gif-i18n.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add GIF translations for every locale
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/i18n.js';
          let s = fs.readFileSync(path, 'utf8');
          const reps = [
            ["'Exportar video':'Exportar vídeo','Exportar audio':'Exportar áudio'", "'Exportar video':'Exportar vídeo','Exportar audio':'Exportar áudio','Exportar GIF':'Exportar GIF','GIF optimizado: VibeCut crea una paleta dedicada y, si usas un límite, ajusta colores, FPS y resolución automáticamente para intentar reducir el peso.':'GIF otimizado: o VibeCut cria uma paleta dedicada e, se você usar um limite, ajusta cores, FPS e resolução automaticamente para tentar reduzir o tamanho.','Mejor calidad':'Melhor qualidade','Optimización':'Otimização','Paleta optimizada':'Paleta otimizada','Varios intentos automáticos si hace falta':'Várias tentativas automáticas se necessário','Generando GIF optimizado…':'Gerando GIF otimizado…','Optimizando GIF para alcanzar el tamaño…':'Otimizando GIF para atingir o tamanho…','Preparando GIF…':'Preparando GIF…','No pudimos preparar este GIF. Prueba con uno más pequeño o conviértelo primero a MP4.':'Não conseguimos preparar este GIF. Tente um menor ou converta primeiro para MP4.'"],
            ["'Exportar video':'Exporter la vidéo','Exportar audio':'Exporter l’audio'", "'Exportar video':'Exporter la vidéo','Exportar audio':'Exporter l’audio','Exportar GIF':'Exporter le GIF','GIF optimizado: VibeCut crea una paleta dedicada y, si usas un límite, ajusta colores, FPS y resolución automáticamente para intentar reducir el peso.':'GIF optimisé : VibeCut crée une palette dédiée et, si vous utilisez une limite, ajuste automatiquement les couleurs, les FPS et la résolution pour réduire la taille.','Mejor calidad':'Meilleure qualité','Optimización':'Optimisation','Paleta optimizada':'Palette optimisée','Varios intentos automáticos si hace falta':'Plusieurs tentatives automatiques si nécessaire','Generando GIF optimizado…':'Création du GIF optimisé…','Optimizando GIF para alcanzar el tamaño…':'Optimisation du GIF pour atteindre la taille cible…','Preparando GIF…':'Préparation du GIF…','No pudimos preparar este GIF. Prueba con uno más pequeño o conviértelo primero a MP4.':'Impossible de préparer ce GIF. Essayez-en un plus petit ou convertissez-le d’abord en MP4.'"],
            ["'Exportar video':'导出视频','Exportar audio':'导出音频'", "'Exportar video':'导出视频','Exportar audio':'导出音频','Exportar GIF':'导出 GIF','GIF optimizado: VibeCut crea una paleta dedicada y, si usas un límite, ajusta colores, FPS y resolución automáticamente para intentar reducir el peso.':'优化 GIF：VibeCut 会创建专用调色板；设置大小限制后，会自动调整颜色、FPS 和分辨率以减小文件。','Mejor calidad':'最佳质量','Optimización':'优化','Paleta optimizada':'优化调色板','Varios intentos automáticos si hace falta':'需要时自动多次尝试','Generando GIF optimizado…':'正在生成优化 GIF…','Optimizando GIF para alcanzar el tamaño…':'正在优化 GIF 以达到目标大小…','Preparando GIF…':'正在准备 GIF…','No pudimos preparar este GIF. Prueba con uno más pequeño o conviértelo primero a MP4.':'无法准备此 GIF。请尝试更小的 GIF，或先转换为 MP4。'"],
            ["'Exportar video':'वीडियो एक्सपोर्ट करें','Exportar audio':'ऑडियो एक्सपोर्ट करें'", "'Exportar video':'वीडियो एक्सपोर्ट करें','Exportar audio':'ऑडियो एक्सपोर्ट करें','Exportar GIF':'GIF एक्सपोर्ट करें','GIF optimizado: VibeCut crea una paleta dedicada y, si usas un límite, ajusta colores, FPS y resolución automáticamente para intentar reducir el peso.':'ऑप्टिमाइज़्ड GIF: VibeCut एक अलग पैलेट बनाता है और आकार सीमा चुनने पर रंग, FPS और रिज़ॉल्यूशन अपने आप समायोजित करता है ताकि फ़ाइल छोटी हो सके।','Mejor calidad':'बेहतर गुणवत्ता','Optimización':'ऑप्टिमाइज़ेशन','Paleta optimizada':'ऑप्टिमाइज़्ड पैलेट','Varios intentos automáticos si hace falta':'ज़रूरत पड़ने पर कई स्वचालित प्रयास','Generando GIF optimizado…':'ऑप्टिमाइज़्ड GIF बनाया जा रहा है…','Optimizando GIF para alcanzar el tamaño…':'लक्षित आकार तक पहुँचने के लिए GIF ऑप्टिमाइज़ हो रहा है…','Preparando GIF…':'GIF तैयार हो रहा है…','No pudimos preparar este GIF. Prueba con uno más pequeño o conviértelo primero a MP4.':'यह GIF तैयार नहीं हो सका। छोटा GIF आज़माएँ या पहले इसे MP4 में बदलें।'"],
            ["'Exportar video':'تصدير الفيديو','Exportar audio':'تصدير الصوت'", "'Exportar video':'تصدير الفيديو','Exportar audio':'تصدير الصوت','Exportar GIF':'تصدير GIF','GIF optimizado: VibeCut crea una paleta dedicada y, si usas un límite, ajusta colores, FPS y resolución automáticamente para intentar reducir el peso.':'GIF محسّن: ينشئ VibeCut لوحة ألوان مخصصة، وعند استخدام حد للحجم يضبط الألوان ومعدل الإطارات والدقة تلقائيًا لتقليل حجم الملف.','Mejor calidad':'أفضل جودة','Optimización':'التحسين','Paleta optimizada':'لوحة ألوان محسّنة','Varios intentos automáticos si hace falta':'محاولات تلقائية متعددة عند الحاجة','Generando GIF optimizado…':'جارٍ إنشاء GIF محسّن…','Optimizando GIF para alcanzar el tamaño…':'جارٍ تحسين GIF للوصول إلى الحجم المطلوب…','Preparando GIF…':'جارٍ تجهيز GIF…','No pudimos preparar este GIF. Prueba con uno más pequeño o conviértelo primero a MP4.':'تعذر تجهيز ملف GIF هذا. جرّب ملفًا أصغر أو حوّله أولًا إلى MP4.'"]
          ];
          for (const [a,b] of reps) {
            if (!s.includes(a)) throw new Error('Missing locale target: ' + a.slice(0, 60));
            s = s.replace(a,b);
          }
          fs.writeFileSync(path, s);
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/i18n.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: translate GIF mode in all locales"
          git push
