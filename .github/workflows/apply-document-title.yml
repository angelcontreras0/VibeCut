name: Apply VibeCut tab title

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-document-title.mjs'
      - '.github/workflows/apply-document-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply title patch
        run: node scripts/patch-document-title.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "feat: show export progress in browser tab"
          git push
