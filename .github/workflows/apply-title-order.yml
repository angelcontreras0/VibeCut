name: Apply title order fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-title-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put progress first in tab title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace('document.title = "VibeCut — Error";', 'document.title = "⚠ Error — VibeCut";')
          s = s.replace('document.title = pct > 0 ? `VibeCut — ${pct}%` : "VibeCut — Renderizando...";', 'document.title = pct > 0 ? `${pct}% — VibeCut` : "Exportando… — VibeCut";')
          s = s.replace('document.title = "VibeCut — Listo ✓";', 'document.title = "✓ Listo — VibeCut";')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "angel"
          git config user.email "94728950+angelcontreras0@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "fix: show export progress first in browser tab"
          git push
